[project]
name = "omni-reader"
version = "1.0.0"
description = "Universal Low-Latency Local Screen and Document Reader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pystray>=0.19.5",
    "pynput>=1.8.0",
    "pyperclip>=1.9.0",
    "pyobjc-framework-cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
omnisay = "omni_reader.cli:run_cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omni_reader*"]

